[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nano3ble"
version = "0.1.0"
description = "BLE WiFi provisioning tool for the Avalon Nano3s Bitcoin miner"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
]

[project.scripts]
nano3ble = "nano3ble.cli:main"
