[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nano3ble"
dynamic = ["version"]
description = "BLE Wi-Fi provisioning tool for the Avalon Nano3s Bitcoin miner"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
]

[project.scripts]
nano3ble = "nano3ble.cli:main"

[project.urls]
Repository = "https://github.com/skot/nano3ble"
Issues = "https://github.com/skot/nano3ble/issues"

[tool.setuptools.packages.find]
include = ["nano3ble"]

[tool.setuptools.dynamic]
version = { attr = "nano3ble.__version__" }
